<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experimental Odyssey | Grade 7 | Experiment 10 Animation</title>
<style>
:root{--blue:#2563eb;--deep:#163b82;--ink:#172554;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:linear-gradient(135deg,#eff6ff,#fff);color:var(--ink)}header{background:linear-gradient(115deg,#163b82,#2563eb,#38bdf8);color:#fff;padding:25px 18px}.wrap{max-width:1050px;margin:auto;padding:18px}.eyebrow{font-size:.76rem;font-weight:900;letter-spacing:2px;color:#dbeafe}.hero{display:flex;justify-content:space-between;align-items:center;gap:18px}.hero h1{font-size:clamp(1.8rem,5vw,2.8rem);margin:7px 0}.hero p{margin:0;color:#eff6ff}.heroicon{font-size:4.4rem}.scene{background:#ffffffef;border:1px solid #cbdcf7;border-radius:24px;padding:22px;box-shadow:0 12px 30px #163b8212}.progress{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar{height:100%;width:16.66%;background:linear-gradient(90deg,#2563eb,#38bdf8);transition:.4s}.visual{height:370px;border-radius:20px;background:linear-gradient(#eff6ff,#dbeafe);position:relative;overflow:hidden;margin:18px 0;border:1px solid #bfdbfe}.caption{font-size:1.25rem;font-weight:900}.desc{color:#475569}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:12px;padding:11px 16px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer;min-height:44px}.btn.alt{background:#eef4ff;color:#1e40af;border:1px solid #bfd4fa}.wire{position:absolute;left:7%;right:7%;top:25%;height:7px;background:#ef476f;border-radius:9px}.compass{position:absolute;width:120px;height:120px;border-radius:50%;border:6px solid #94a3b8;background:white;left:25%;top:30%;display:flex;align-items:center;justify-content:center;font-weight:900}.needle{position:absolute;width:72px;height:5px;background:#ef4444;border-radius:4px;transform-origin:center;transition:.6s}.needle:after{content:"";position:absolute;right:-2px;top:-5px;border-left:12px solid #ef4444;border-top:7px solid transparent;border-bottom:7px solid transparent}.battery{position:absolute;right:10%;bottom:22px;background:#1e293b;color:white;border-radius:12px;padding:15px}.switch{position:absolute;left:58%;bottom:28px;background:#f59e0b;padding:11px 17px;border-radius:10px;font-weight:900}.nail{position:absolute;width:280px;height:58px;left:calc(50% - 140px);top:42%;border-radius:18px;background:linear-gradient(#94a3b8,#475569)}.coil{position:absolute;width:280px;height:58px;left:calc(50% - 140px);top:42%;border-top:8px solid #c2410c;border-bottom:8px solid #c2410c;background:repeating-linear-gradient(90deg,transparent 0 8px,#d97706 8px 14px);border-radius:18px}.clips{position:absolute;right:12%;top:55%;font-size:2.3rem;animation:clips 1.2s ease-in-out infinite alternate}@keyframes clips{to{transform:translateY(-12px)}}.heatwire{position:absolute;left:15%;right:15%;top:43%;height:48px;border-radius:12px;background:#94a3b8}.hot{background:linear-gradient(90deg,#fb923c,#ef4444,#fb923c);box-shadow:0 0 35px #f97316aa;animation:pulse .8s infinite alternate}@keyframes pulse{to{filter:brightness(1.3)}}.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}.step{padding:12px;border-radius:14px;background:#eff6ff;border:1px solid #bfdbfe;font-weight:800}.footer{text-align:center;color:#64748b;padding:16px}@media(max-width:650px){.hero{flex-direction:column;align-items:flex-start}.visual{height:300px}}
</style><style>
.audio-panel{position:sticky;top:10px;z-index:20;margin:12px 0;padding:12px 16px;border-radius:16px;background:linear-gradient(135deg,#062b55,#0b5ca8);color:#fff;box-shadow:0 8px 24px #0002;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.audio-panel button{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:#ffd22e;color:#062b55}.audio-panel button.secondary{background:#fff;color:#062b55}.audio-status{font-size:.9rem;opacity:.9}
</style></head><body><div class="audio-panel"><strong>🔊 Audio Guide</strong><button onclick="speakCurrent()">▶ Play Narration</button><button class="secondary" onclick="stopNarration()">■ Stop</button><span class="audio-status" id="audioStatus">Ready — listen to the experiment steps.</span></div><header><div class="wrap hero"><div><div class="eyebrow">GRADE 7 • SCIENCE LAB MANUAL</div><h1>EXPERIMENT 10 • ELECTRIC CURRENT &amp; ITS EFFECTS</h1><p>Magnetic effect • electromagnet • heating effect</p></div><div class="heroicon">⚡🧲</div></div></header><main class="wrap"><section class="scene"><div class="progress"><div id="bar" class="bar"></div></div><div id="visual" class="visual"></div><div id="caption" class="caption"></div><p id="desc" class="desc"></p><div class="controls"><button class="btn alt" id="prev">← Previous</button><button class="btn" id="next">Next →</button><button class="btn alt" id="auto">▶ Play</button></div><div id="flow" class="flow"></div></section><div class="footer">Experimental Odyssey • Learn by doing • Observe • Question • Experiment • Discover</div></main>
<script>
const scenes=[
{title:'1. Compass under a straight wire',desc:'Place the compass on the table and hold a straight wire from the circuit just above it, along the needle (N–S).',draw:()=>`<div class="wire"></div><div class="compass"><span>N&nbsp;&nbsp; E<br>W&nbsp;&nbsp; S</span><div class="needle"></div></div><div class="battery">2 dry cells</div>`},
{title:'2. Switch ON: watch the needle',desc:'Close the switch for 2 seconds. The current-carrying wire makes a magnetic field and the compass needle deflects. Open the switch.',draw:()=>`<div class="wire"></div><div class="compass"><span>N&nbsp;&nbsp; E<br>W&nbsp;&nbsp; S</span><div class="needle" style="transform:rotate(24deg)"></div></div><div class="battery">Switch ON • 2 cells</div>`},
{title:'3. Wind 50 turns on a nail',desc:'Wind 50 turns of insulated wire neatly around the soft iron nail. Scrape the ends clean before connecting.',draw:()=>`<div class="nail"></div><div class="coil"></div>`},
{title:'4. Count clips with 1 cell',desc:'Join the coil to one cell and switch on briefly. About 5 paper clips stick to the electromagnet.',draw:()=>`<div class="nail"></div><div class="coil"></div><div class="clips">📎📎📎📎📎</div>`},
{title:'5. Count clips with 2 cells',desc:'Repeat with two cells. About 10 clips stick: more current gives a stronger magnetic effect.',draw:()=>`<div class="nail"></div><div class="coil"></div><div class="clips">📎📎📎📎📎📎📎📎📎📎</div>`},
{title:'6. Feel nichrome warm (3 s)',desc:'Join the nichrome wire across the cells for 3 seconds, then switch off and touch it carefully with the back of a finger. This shows the heating effect.',draw:()=>`<div class="heatwire hot"></div>`}
];
let i=0,timer=null;function render(){const s=scenes[i];document.getElementById('visual').innerHTML=s.draw();document.getElementById('caption').textContent=s.title;document.getElementById('desc').textContent=s.desc;if(window.speak){window.currentNarration=s.desc;setTimeout(()=>speakCurrent(),120);}document.getElementById('bar').style.width=((i+1)/scenes.length*100)+'%';document.getElementById('flow').innerHTML=scenes.map((x,k)=>`<div class="step" style="opacity:${k===i?1:.58}">${k+1}. ${x.title.replace(/^\d+\. /,'')}</div>`).join('');document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===scenes.length-1}
function next(){if(i<scenes.length-1){i++;render()}else stop()}function prev(){if(i>0){i--;render()}}function stop(){clearInterval(timer);timer=null;document.getElementById('auto').textContent='▶ Play'}document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('auto').onclick=()=>{if(timer){stop()}else{document.getElementById('auto').textContent='⏸ Pause';timer=setInterval(()=>{if(i<scenes.length-1){i++;render()}else stop()},2800)}};render();
</script><script>
const narration = {
 title: "Experiment 10. Electric Current and Its Effects.",
 intro: "In this experiment, we investigate the magnetic effect and heating effect of electric current.",
 compass: "Connect a compass near the current carrying wire. When the switch is turned on, the compass needle deflects, showing that electric current produces a magnetic effect.",
 electromagnet: "Wrap about fifty turns of insulated wire around an iron nail and connect the circuit. The nail becomes an electromagnet and attracts paper clips.",
 cells1: "With one cell, the electromagnet attracts about five paper clips in the model observation.",
 cells2: "With two cells, the current is greater and the electromagnet attracts about ten paper clips in the model observation.",
 heat: "Pass current through the nichrome wire for three seconds. The wire becomes hot, demonstrating the heating effect of electric current.",
 conclusion: "Electric current can produce magnetic and heating effects. Increasing the number of cells can strengthen the magnetic effect in the electromagnet model.",
 safety: "Do not touch a heated nichrome wire. Switch off the circuit after each observation and follow teacher instructions."
};
function speak(text){ if(!('speechSynthesis' in window)){document.getElementById('audioStatus').textContent='Audio is not supported in this browser.';return;} speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='en-IN'; u.rate=.9; u.pitch=1; u.onstart=()=>document.getElementById('audioStatus').textContent='Playing narration…'; u.onend=()=>document.getElementById('audioStatus').textContent='Narration complete.'; speechSynthesis.speak(u); }
function speakCurrent(){ speak(window.currentNarration || (narration.title+' '+narration.intro+' '+narration.conclusion)); }
function stopNarration(){if('speechSynthesis' in window)speechSynthesis.cancel();document.getElementById('audioStatus').textContent='Narration stopped.';}
window.setNarration=function(key){window.currentNarration=narration[key]||key;speakCurrent();}
window.addEventListener('load',()=>{const root=document.querySelector('body'); if(root && !document.querySelector('.audio-panel')){root.insertAdjacentHTML('afterbegin',`<div class="audio-panel"><strong>🔊 Audio Guide</strong><button onclick="speakCurrent()">▶ Play Narration</button><button class="secondary" onclick="stopNarration()">■ Stop</button><span class="audio-status" id="audioStatus">Ready — listen to the experiment steps.</span></div>`);}});
</script></body></html>
